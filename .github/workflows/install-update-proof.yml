# PROTOTYPE, throwaway: Install and update proof. Lives only on its prototype branch.
name: Install and update proof

on:
  push:
    branches: [prototype/install-update-proof]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the proof APKs
        run: bash prototypes/install-update-proof/build.sh "$RUNNER_TEMP/apks"
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apks
          path: |
            ${{ runner.temp }}/apks/*.apk
            ${{ runner.temp }}/apks/*.md
            ${{ runner.temp }}/apks/package.json

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-10-2gb-720p
            api: 29
            ram: 2048M
          - name: android-current
            api: 36
            ram: 4096M
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: proof-apks
          path: apks
      - name: Run the proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1280
          disable-animations: true
          script: bash prototypes/install-update-proof/run-proof.sh apks results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-results-${{ matrix.name }}
          path: results
