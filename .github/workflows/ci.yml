# Every push: tests and typecheck, a signed `.test` APK, and a launch check on
# GitHub's Android 10 (2 GB, 720p) and current emulators.
#
# Test signing key, from repo secrets when they exist (Settings > Secrets and
# variables > Actions):
#   MHIZHA_TEST_KEYSTORE_BASE64   the test keystore file, base64-encoded
#   MHIZHA_TEST_KEYSTORE_PASSWORD its store password
#   MHIZHA_TEST_KEY_ALIAS         the key alias inside it
#   MHIZHA_TEST_KEY_PASSWORD      the key password (defaults to the store password)
# Without them the run makes a throwaway key, so its APK cannot install over a
# `.test` build from another run. The release key is never used here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build the .test APK
        run: bash scripts/ci/build-apk.sh "$RUNNER_TEMP/apk"
        env:
          CI: '1'
          MHIZHA_BUILD: ${{ github.run_number }}
      - name: Sign it with the test key
        run: bash scripts/ci/sign-apk.sh "$RUNNER_TEMP/apk/unsigned.apk" "$RUNNER_TEMP/apk/mhizha-test.apk"
        env:
          MHIZHA_TEST_KEYSTORE_BASE64: ${{ secrets.MHIZHA_TEST_KEYSTORE_BASE64 }}
          MHIZHA_TEST_KEYSTORE_PASSWORD: ${{ secrets.MHIZHA_TEST_KEYSTORE_PASSWORD }}
          MHIZHA_TEST_KEY_ALIAS: ${{ secrets.MHIZHA_TEST_KEY_ALIAS }}
          MHIZHA_TEST_KEY_PASSWORD: ${{ secrets.MHIZHA_TEST_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: mhizha-test-apk
          path: ${{ runner.temp }}/apk/mhizha-test.apk
          retention-days: 7
          if-no-files-found: error

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-10-2gb-720p
            api: 29
            ram: 2048M
          - name: android-current
            api: 36
            ram: 4096M
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: mhizha-test-apk
          path: apk
      - name: Install and check it launches to Home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1280
          disable-animations: true
          script: bash scripts/ci/launch-check.sh apk/mhizha-test.apk results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check-${{ matrix.name }}
          path: results
          retention-days: 7
