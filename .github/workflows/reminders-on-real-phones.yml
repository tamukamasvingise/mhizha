# PROTOTYPE, throwaway: Reminders on real phones. Lives only on its prototype branch.
name: Reminders test build

on:
  push:
    branches: [prototype/reminders-on-real-phones]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the reminders test APK
        run: bash prototypes/reminders-on-real-phones/build.sh "$RUNNER_TEMP/apks"
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: reminders-test-apk
          path: |
            ${{ runner.temp }}/apks/*.apk
            ${{ runner.temp }}/apks/*.txt
            ${{ runner.temp }}/apks/package.json
